{% extends "base.html" %}

{% block title %}登录 - DocQuiz{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: calc(100vh - 200px);">
    <div style="background: white; padding: 50px 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 480px; border-top: 6px solid #1890ff;">
        
        <h2 style="text-align: center; color: #333; margin-top: 0; margin-bottom: 10px; font-size: 28px; font-weight: bold;">欢迎回来</h2>
        <img src="{{ url_for('static', filename='images/logo.png') }}" style="height: 60px; display: block; margin: 0 auto 20px auto;" alt="Logo">

        <!-- 消息提示 -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="background-color: #fff2f0; color: #ff4d4f; padding: 10px; border-radius: 6px; margin-bottom: 20px; text-align: center; font-size: 14px; border: 1px solid #ffccc7;">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="post">
            <div style="margin-bottom: 24px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #595959;">用户名</label>
                <input type="text" name="username" required placeholder="请输入用户名" 
                       style="width: 100%; padding: 14px 16px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 16px; outline: none; transition: all 0.3s; box-sizing: border-box;"
                       onfocus="this.style.borderColor='#1890ff'; this.style.boxShadow='0 0 0 3px rgba(24,144,255,0.2)';"
                       onblur="this.style.borderColor='#d9d9d9'; this.style.boxShadow='none';">
            </div>

            <div style="margin-bottom: 32px;">
                <label style="display: block; margin-bottom: 8px; font-weight: 500; color: #595959;">密码</label>
                <input type="password" name="password" required placeholder="请输入密码" 
                       style="width: 100%; padding: 14px 16px; border: 1px solid #d9d9d9; border-radius: 8px; font-size: 16px; outline: none; transition: all 0.3s; box-sizing: border-box;"
                       onfocus="this.style.borderColor='#1890ff'; this.style.boxShadow='0 0 0 3px rgba(24,144,255,0.2)';"
                       onblur="this.style.borderColor='#d9d9d9'; this.style.boxShadow='none';">
            </div>

            <button type="submit" 
                    style="width: 100%; padding: 14px; background-color: #1890ff; color: white; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: all 0.3s; box-shadow: 0 4px 12px rgba(24,144,255,0.3);"
                    onmouseover="this.style.backgroundColor='#40a9ff'; this.style.transform='translateY(-2px)'"
                    onmouseout="this.style.backgroundColor='#1890ff'; this.style.transform='translateY(0)'">
                登 录
            </button>
        </form>

        <div style="text-align: center; margin-top: 24px; font-size: 15px; color: #8c8c8c;">
            没有账号？ <a href="{{ url_for('auth.register') }}" style="color: #1890ff; font-weight: bold; text-decoration: none;">立即注册</a>
        </div>
    </div>
</div>
{% endblock %}
