<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f1e9">
  <title>{% block title %}DocQuiz{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a href="/" class="brand" aria-label="DocQuiz 首页">
        <span class="brand-mark">D</span>
        <span class="brand-word">DocQuiz<small>慢一点，学得更扎实</small></span>
      </a>
      {% if current_user.is_authenticated %}
      <nav class="main-nav" aria-label="主导航">
        <a href="/" class="nav-link">我的题库</a>
        <a href="/wrong" class="nav-link">错题本</a>
        <a href="/favorites" class="nav-link">我的收藏</a>
      </nav>
      <div class="account-menu">
        <span class="account-avatar">{{ current_user.username[0]|upper }}</span>
        <span class="account-name">{{ current_user.username }}</span>
        <a class="logout-link" href="{{ url_for('auth.logout') }}">退出</a>
      </div>
      {% else %}
      <nav class="main-nav guest-nav">
        <a href="{{ url_for('auth.login') }}" class="nav-link">登录</a>
        <a href="{{ url_for('auth.register') }}" class="nav-link nav-link-accent">创建账号</a>
      </nav>
      {% endif %}
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer"><span>DOCQUIZ</span><span>把每一次练习，变成真正的掌握。</span></footer>
  {% block scripts %}{% endblock %}
</body>
</html>
